<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakti Shopee Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <p class="eyebrow">[+] Pakti Extension</p>
          <h1>Shopee Webchat</h1>
        </div>
        <span class="badge">webchat only</span>
      </header>

      <p class="muted">Sinkron order dan proses chat Shopee hanya melalui tab Webchat.</p>

      <section class="panel compact">
        <div class="status-grid">
          <span>Active tab</span>
          <strong id="pageModeText">checking...</strong>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Config</h2>
          <span class="hint">required</span>
        </div>
        <label>
          API Base URL
          <input id="apiBaseUrl" type="url" placeholder="https://api-pakti.zakado.id" />
        </label>

        <label>
          Extension API Key
          <input id="apiKey" type="password" placeholder="SHOPEE_EXTENSION_API_KEY" />
        </label>

        <button id="saveButton" type="button" class="secondary">[save-config]</button>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Order tools</h2>
          <span class="hint">seller page</span>
        </div>
        <div class="actions single">
          <button id="syncButton" type="button">[extract-sync]</button>
          <button id="prepareShippingChatsButton" type="button" class="secondary">[prepare-shipping]</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Webchat tools</h2>
          <span class="hint">/new-webchat</span>
        </div>
        <div class="actions single">
          <button id="autoPrepareButton" type="button" class="secondary">[auto-prepare-video]</button>
          <button id="loadChatJobsButton" type="button" class="secondary">[load-pending]</button>
          <label>
            Pending Chat Job
            <select id="chatJobSelect" disabled>
              <option value="">Belum ada job dimuat</option>
            </select>
          </label>
          <button id="prepareChatButton" type="button">[send-selected-chat]</button>
          <button id="markSentButton" type="button" class="secondary" disabled>[mark-sent-manual]</button>
        </div>
      </section>

      <section class="panel preview" aria-live="polite">
        <div class="panel-head">
          <h2>Status</h2>
          <span class="hint">live log</span>
        </div>
        <pre id="statusText">Ready.</pre>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
